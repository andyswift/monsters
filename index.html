<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stranger Monsters</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #frame { position: relative; box-shadow: 0 0 60px rgba(255, 45, 77, 0.25); }
      #screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; filter: saturate(1.25) contrast(1.08); }
      #frame::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.28) 0, rgba(0, 0, 0, 0.28) 1px, transparent 1px, transparent 3px),
          radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div id="frame"><canvas id="screen"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
